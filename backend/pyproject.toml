[project]
name = "accent-trainer-backend"
version = "0.1.0"
description = "General American pronunciation & accent trainer: scoring engine + API"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "praat-parselmouth>=0.4.3",
  "librosa>=0.10",
  "cmudict>=1.0",
  "soundfile>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "python-multipart>=0.0.9",
  "wordfreq>=3.1",
  "reportlab>=4.0",
  "anthropic>=2.8",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.40", "huggingface_hub>=0.24"]
speech = ["piper-tts>=1.3"]  # reference TTS; Whisper ASR comes with `ml`
postgres = ["asyncpg>=0.29"]
worker = ["arq>=0.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["accent_engine*", "app*", "trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E741", "SIM108", "B008", "E501"]  # B008: FastAPI Depends/File defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
exclude = ["tests/", "scripts/"]
